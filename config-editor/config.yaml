name: Config Editor
version: "0.4.0"
slug: config_editor
description: Mobile-first file editor for your Home Assistant configuration, with HA-aware completion and validation.
url: https://github.com/glassp/haos-config-editor
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:file-edit-outline
panel_title: Config Editor
panel_admin: true
hassio_api: true
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: ssl
    read_only: true
  - type: all_addon_configs
    read_only: false
  - type: addons
    read_only: false
options:
  read_only: false
  allowed_roots:
    - config
    - share
    - ssl
    - media
    - addon_configs
    - addons
  allow_storage: false
  max_file_size_kb: 2048
  history_limit: 20
schema:
  read_only: bool
  allowed_roots:
    - str
  allow_storage: bool
  max_file_size_kb: int(64,20480)
  history_limit: int(0,200)
